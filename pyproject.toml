[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-cache-guard"
version = "0.1.0"
description = "Reduce DeepSeek context-cache misses for agent harnesses: prefix stabilization, diagnostics, hit-rate reporting."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["deepseek", "cache", "prompt-caching", "agent", "harness"]

[project.scripts]
ds-cache-guard = "ds_cache_guard.cli:main"

[tool.setuptools.packages.find]
include = ["ds_cache_guard*"]
