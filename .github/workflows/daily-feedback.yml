name: Daily feedback collection

on:
  schedule:
    # 06:00 UTC = 14:00 Beijing time
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Collect project feedback metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: theworld-lab/deep-seek-cache-plugin
        run: python scripts/collect_feedback.py
      - name: Commit and push updated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FEEDBACK.md
          git diff --cached --quiet || git commit -m "chore: daily feedback report update [skip ci]"
          git push
